<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Matching &amp; Optimal Transport — Sudarshan Babu</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f5; --panel: #ffffff; --ink: #1a2230;
      --navy: #2a54a0; --blue: #2462b0; --gold: #a9771a; --gold-deep: #8c6112;
      --blue-soft: #e9eef6; --silver: #c7cedb; --line: #dde2ea;
      --muted: #5c6675; --faint: #8b94a2;
      --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 10px 28px rgba(20,40,80,0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Inter","Helvetica Neue",Arial,sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid var(--silver);
      backdrop-filter: saturate(160%) blur(10px);
    }
    .nav-inner {
      max-width: 980px; margin: 0 auto; padding: 0.6em 1.6em;
      display: flex; align-items: center; justify-content: space-between; gap: 1em;
    }
    .brand { font-weight: 700; color: var(--gold); }
    .brand:hover { color: var(--gold-deep); text-decoration: none; }
    .back { font-size: 0.9em; font-weight: 500; color: var(--muted); }
    .back:hover { color: var(--navy); text-decoration: none; }

    main { max-width: 980px; margin: 0 auto; padding: 2.4em 1.6em 3.5em; }
    h1 { font-size: 1.9em; font-weight: 600; color: var(--navy); margin: 0 0 0.2em; letter-spacing: -0.01em; }
    .lead { color: var(--muted); margin: 0 0 1.4em; font-size: 1.02em; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.6em; margin-bottom: 1.6em; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4em;
      font-size: 0.92em; font-weight: 600; padding: 0.55em 1.1em;
      border-radius: 9px; border: 1px solid var(--silver);
      background: #fff; color: var(--navy); box-shadow: var(--shadow);
      transition: transform 0.14s, box-shadow 0.14s, border-color 0.14s;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--navy); text-decoration: none; }
    .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }

    .viewer {
      width: 100%; height: 80vh; min-height: 480px;
      border: 1px solid var(--silver); border-radius: 12px;
      box-shadow: var(--shadow); background: #fff; overflow: hidden;
    }
    .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }
    .fallback { font-size: 0.9em; color: var(--faint); margin-top: 0.8em; }

    footer {
      max-width: 980px; margin: 0 auto; padding: 1.6em;
      color: var(--faint); font-size: 0.85em; border-top: 1px solid var(--silver);
    }
    @media (max-width: 620px) {
      .nav-inner, main { padding-left: 1.1em; padding-right: 1.1em; }
      h1 { font-size: 1.5em; }
      .viewer { height: 70vh; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="../" class="brand">Sudarshan Babu</a>
      <a href="../#notes" class="back">&larr; Back to notes</a>
    </div>
  </nav>

  <main>
    <h1>Flow Matching &amp; Optimal Transport</h1>
    <p class="lead">From normalizing flows to conditional flow matching. 77 slides.</p>

    <div class="actions">
      <a class="btn primary" href="flow_matching_polished.pdf?v=2" target="_blank" rel="noopener">Open PDF</a>
      <a class="btn" href="flow_matching_polished.pdf?v=2" download>Download PDF</a>
      <a class="btn" href="flow_matching_polished.pptx?v=2" download>Download PPTX</a>
    </div>

    <div class="viewer">
      <iframe src="flow_matching_polished.pdf?v=2#view=FitH" title="Flow Matching &amp; Optimal Transport (PDF)"></iframe>
    </div>
    <p class="fallback">If the slides don't load above, use <a href="flow_matching_polished.pdf?v=2" target="_blank" rel="noopener">Open PDF</a>.</p>
  </main>

  <footer>
    © <span id="yr"></span> Sudarshan Babu
  </footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
